<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeetCode Token Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Productivity Blocker</h1>
    <div id="productivity-status" class="productivity-status blocked">Status: Blocked</div>
    <button id="check-status-btn" class="secondary-btn">Check Status Now</button>

    <div class="section stringency-section">
      <h3>Stringency Level</h3>
      <select id="stringency-level">
        <option value="1">Level 1: Block Adult Sites</option>
        <option value="2">Level 2: Block Adult & Social Media</option>
        <option value="3">Level 3: Block Adult, Social & Entertainment</option>
        <option value="4">Level 4: Block ALL except LeetCode</option>
      </select>
      <p class="hint">Higher levels block more distractions.</p>
    </div>

    <hr class="divider" />

    <h1>LeetCode Tokens</h1>
    <div class="section">
      <label for="session">LEETCODE_SESSION</label>
      <textarea id="session" readonly placeholder="Not found"></textarea>
      <button id="copy-session">Copy session</button>
    </div>
    <div class="section">
      <label for="csrf">csrftoken</label>
      <textarea id="csrf" readonly placeholder="Not found"></textarea>
      <button id="copy-csrf">Copy CSRF</button>
    </div>
    <div id="status" class="status"></div>
    <p class="hint">Make sure you're logged in at leetcode.com, then open this popup.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
